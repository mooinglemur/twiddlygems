# Pushing a v-tag publishes a release.
#
#     git tag v0.1.2 && git push github v0.1.2
#
# Two files go out with it: the .apworld a host installs, and the player yaml
# template a player fills in. Both are built here rather than uploaded by hand,
# and the yaml is generated from the zip in the same run, so the pair in a
# release always belong to each other.
#
# Nothing is published that has not passed the world's own tests and a real
# generation from the packaged zip. A release is the one build where being
# slow is free and being wrong is expensive.

name: Release

on:
  push:
    tags:
      # Narrowed to a real semver in `validate` below, because a tag filter is
      # a glob and cannot say "three numbers".
      - 'v[0-9]*'

jobs:
  # Cheap, and first, so a mistyped tag fails in seconds rather than after a
  # full build. The crate version is what `world_version` in the packaged
  # manifest is built from, so a tag that disagrees with it would publish an
  # .apworld announcing a different version than the release it came in.
  validate:
    name: the tag matches the crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version match
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          # Semver, with an optional prerelease and an optional build. The tag
          # filter only promised a leading v and a digit.
          if ! printf '%s' "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not a semver tag. Expected something like v1.2.3."
            exit 1
          fi

          # The version out of [package] alone. A dependency's version further
          # down the file would otherwise match first.
          CRATE_VERSION=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^version' | cut -d'"' -f2)
          echo "Crate version: $CRATE_VERSION"

          # Compared against the release part only, so v1.2.3-rc.1 may be cut
          # from a crate at 1.2.3: a prerelease is a candidate for the version
          # it names rather than a version of its own.
          if [ "${TAG_VERSION%%-*}" != "$CRATE_VERSION" ]; then
            echo "::error::Version mismatch. Tag ($TAG_VERSION) does not match Cargo.toml ($CRATE_VERSION)."
            exit 1
          fi
          echo "Version check passed."

  # The same image and the same targets the CI workflow uses, so what is
  # published is built the way everything else is tested.
  build:
    name: build the world
    needs: validate
    runs-on: ubuntu-latest
    container: rust:1.95-trixie
    env:
      NODE_VERSION: '24.21.0'
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      - uses: actions/checkout@v4

      - name: Install python and git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-venv git

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: .cargo
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - uses: actions/cache@v4
        with:
          path: |
            vendor
            .venv
          key: archipelago-${{ hashFiles('Makefile') }}

      - run: rustup target add wasm32-unknown-unknown

      - name: Archipelago checkout and venv
        run: make ap-setup

      # The gate. A release that ships a world which cannot generate is worse
      # than no release, and this is the same pair of suites CI runs.
      - name: World tests, ours and Archipelago's
        run: make apworld-test

      - name: Generate a seed from the installed zip
        run: make apworld-install

      - name: Package the world and its player template
        run: make template

      - name: Hand them to the release job
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/twiddlygems.apworld
            build/twiddlygems.yaml
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release_assets

      - name: Show what is going out
        run: ls -l release_assets

      - name: Create the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ github.ref_name }}
          name: Twiddly Gems ${{ github.ref_name }}
          # A prerelease tag carries a hyphen, which is what semver says it is
          # for. Nothing else needs to be said anywhere to mark one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') }}
          replacesArtifacts: true
          artifacts: release_assets/*
          body: |
            A match-3 puzzle game that is also an Archipelago world.

            **Play it at <https://gems.browsergam.ing/>.**

            ## What is in this release

            - **`twiddlygems.apworld`** goes in your Archipelago installation's
              `custom_worlds/` directory.
            - **`twiddlygems.yaml`** is the player template, with every setting
              documented in place.

            Both were built from this tag and tested together: the yaml is
            generated from the `.apworld` beside it, so the versions in its
            header are the ones this world was packaged with.

            ## Connecting

            Open <https://gems.browsergam.ing/>, choose Archipelago on the title
            screen, and give it the server, port and slot name. The run is kept
            on the server rather than in the browser, so you can pick it up on
            another device.
