# A player file for `make apworld-gen`, which rolls a real seed to prove the
# world generates rather than only that its rules hold.
#
# Set away from the defaults on purpose. A generation at the defaults proves
# the ordinary case, which is the case a bug is least likely to be hiding in:
# the bonus items are asked for at their ceiling, which is the pool at its
# fullest and the hardest thing for the world to find room for, and the ladder
# opens by item, which is the only setting that gives the fill a real ladder to
# work along rather than a world open from the start.
name: Tester
game: Twiddly Gems
Twiddly Gems:
  inventory_items: 15
  # `true` rather than `on`, so a real generation proves the setting takes the
  # word a player would reach for. It is an Archipelago Toggle, not a choice
  # of two, which is what makes that work.
  progressive_levels: true
  spare_unlocks: 20
  # Leaned rather than even, and with one kind left out altogether, so a real
  # generation walks the weighted draw and the zero rather than only the
  # default. These are relative: what they say is that a bonus item is four
  # times more likely to be a rocket than a rainbow, and never a cluster.
  inventory_item_chance:
    rocket: 200
    rainbow: 50
    cross_clear: 50
    rocket_cluster: 0
