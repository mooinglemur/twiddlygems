<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#151226">
<meta name="description" content="Twiddly Gems, a match-3 puzzle">
<title>Twiddly Gems</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="levels-button" class="icon-button" type="button" aria-label="Choose a level">&#9776;</button>
    <div id="level-title">
      <span id="level-number">Level 1</span>
      <span id="level-name">&nbsp;</span>
    </div>
    <div id="moves-box">
      <span class="label">Moves</span>
      <span id="moves">0</span>
    </div>
    <button id="score-box" type="button" aria-expanded="false" aria-controls="score-marks">
      <span class="label">Score</span>
      <span id="score">0</span>
    </button>
    <!-- What this level can be beaten to, behind a tap of the score rather
         than beside it: two numbers nobody is reading most of the time. -->
    <div id="score-marks" class="hidden" role="dialog" aria-label="What this level can be beaten to"></div>
  </header>

  <ul id="objectives" aria-label="Level objectives"></ul>

  <ul id="feed" aria-label="Items" aria-live="polite"></ul>

  <main id="stage">
    <canvas id="board" aria-label="Game board" role="img"></canvas>
  </main>

  <footer id="bottombar">
    <!-- What the run has to spend, each in a place of its own. A slot stays
         where it is whether or not there is anything in it: what a run is out
         of is worth as much to know as what it is carrying. -->
    <ul id="inventory" aria-label="Items to spend"></ul>
    <button id="sound-button" class="icon-button" type="button" aria-label="Toggle sound" aria-pressed="false">&#128266;</button>
    <button id="retry-button" class="text-button" type="button">Restart</button>
  </footer>
</div>

<!-- What a clear sends to the goal it counted toward. Over the whole page
     rather than inside the board, because that is the journey it makes. -->
<canvas id="fx" aria-hidden="true"></canvas>

<div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
  <div id="overlay-card">
    <h2 id="overlay-title">Level complete</h2>
    <p id="overlay-body"></p>
    <div id="tracker" class="hidden">
      <div id="tracker-items" role="list" aria-label="Items found"></div>
      <div id="level-list" role="list" aria-label="Levels"></div>
    </div>
    <div id="overlay-buttons"></div>
  </div>
</div>

<div id="title" role="dialog" aria-modal="true" aria-labelledby="title-heading">
  <div id="title-card">
    <h1 id="title-heading">Twiddly Gems</h1>
    <p id="title-tagline">A match-3 puzzle</p>
    <div id="title-buttons">
      <button id="solo-button" class="primary" type="button">Solo Play</button>
      <p id="solo-note" class="title-note">&nbsp;</p>
      <button id="archipelago-button" type="button" disabled aria-disabled="true">Archipelago</button>
      <p class="title-note">Multiworld play is not built yet.</p>
    </div>
  </div>
</div>

<div id="setup" class="hidden" role="dialog" aria-modal="true" aria-labelledby="setup-heading">
  <div id="setup-card">
    <h2 id="setup-heading">Set up your run</h2>
    <p id="setup-note">These are fixed once the run starts, the way a multiworld's are.</p>
    <div id="setup-options"></div>
    <div id="setup-buttons">
      <button id="setup-start" class="primary" type="button">Start</button>
      <button id="setup-back" type="button">Back</button>
    </div>
  </div>
</div>

<noscript>Twiddly Gems needs JavaScript and WebAssembly.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
